# THROW-AWAY SPIKE. Not part of the app. Run with: docker compose -p spike up -d --build
# Nothing here is published to the network except the owner-only proxy on 127.0.0.1:4190.
name: spike
services:
  site:
    build: ./site
  browser:
    build: ./browser
    init: true
    ipc: host
    environment:
      NO_SANDBOX: "${NO_SANDBOX:-}"
    # No ports are published. Only the proxy can reach this container's VNC and control ports.
  proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:4190:4190"
    environment:
      OWNER_SECRET: "${OWNER_SECRET:?set OWNER_SECRET}"
      ALLOWED_ORIGIN: "http://127.0.0.1:4190"
      BROWSER_CONTROL: "http://browser:8080"
      VNC_HOST: browser
      VNC_PORT: "5900"
    depends_on:
      - browser
