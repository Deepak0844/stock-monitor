# Local and single-server setup: PostgreSQL, a one-off migrate step, the API (which serves the
# web app), the worker, and the browser service that opens supplier websites. Copy .env.example to
# .env and fill it in first.
#
# Networks. `default` holds the database, the API and the worker. The browser service is NOT on it:
#   control  private to the API, the worker and the browser service. It has no way out to the internet.
#   egress   the browser service alone, so it can reach supplier websites and nothing else of ours.
# Postgres is on neither of those, so the browser service cannot even find it.
x-app: &app
  build: .
  image: stock-monitor:local
  init: true
  restart: unless-stopped

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://stock_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@postgres:5432/stock_monitor
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# How the API and worker reach the browser service. The token is the same one the browser service
# is given as CONTROL_TOKEN below.
x-browser-link: &browser-link
  BROWSER_SERVICE_URL: http://browser:8080
  BROWSER_CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?Set BROWSER_CONTROL_TOKEN in .env (openssl rand -hex 24)}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stock_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_owner -d stock_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once per deploy: applies migrations and sets up the restricted login role.
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "--import", "tsx", "packages/db/src/migrate-cli.ts"]
    environment:
      MIGRATION_DATABASE_URL: postgres://stock_owner:${POSTGRES_PASSWORD}@postgres:5432/stock_monitor
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["node", "--import", "tsx", "apps/api/src/index.ts"]
    environment:
      <<: [*app-env, *browser-link]
      HOST: 0.0.0.0
      PORT: "3000"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # The address you open the app at. The live login screen only accepts pages from this exact origin.
      # Left blank, it accepts http://localhost:3000 and http://127.0.0.1:3000.
      APP_ORIGIN: ${APP_ORIGIN:-}
    networks: [default, control]
    # Bound to this machine only. Put an HTTPS reverse proxy in front for anything else.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "apps/worker/src/index.ts"]
    environment:
      <<: [*app-env, *browser-link]
    networks: [default, control]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The only place a supplier's website is ever opened. It has no database access and no encryption key,
  # publishes no port, and is reachable only by the API and worker over the private control network.
  browser:
    build:
      context: .
      dockerfile: services/browser/Dockerfile
    image: stock-monitor-browser:local
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CONTROL_TOKEN: ${BROWSER_CONTROL_TOKEN:?Set BROWSER_CONTROL_TOKEN in .env (openssl rand -hex 24)}
    networks: [control, egress]
    # Chromium's own sandbox stays on. That needs user namespaces, which Docker's default seccomp profile blocks,
    # so this is Playwright's own profile (kept unchanged beside the Dockerfile). Everything else is taken away.
    security_opt:
      - no-new-privileges:true
      - seccomp=./services/browser/seccomp_profile.json
    # Chromium's sandbox puts its helper processes in an empty folder with chroot, so that one capability is given back.
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/pwuser:size=256m,uid=1001,gid=1001
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    pids_limit: 512

networks:
  control:
    internal: true
  egress: {}

volumes:
  pgdata:
